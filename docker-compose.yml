services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://orbital_user:orbital_pass@db:5432/orbital_db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orbital_user
      POSTGRES_PASSWORD: orbital_pass
      POSTGRES_DB: orbital_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      - redis
      - db
    environment:
      DATABASE_URL: postgresql://orbital_user:orbital_pass@db:5432/orbital_db
      REDIS_URL: redis://redis:6379

volumes:
  pg_data: